<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Chính Của Web Bán Điện Thoại</title>
    <link rel="stylesheet" href="./assets/css/components.css">
</head>
<header class="main-header">
    <!-- Phần top của Header -->
    <div class="header-top">
        <!-- Logo -->
         <div class="logo">
            <a href="index.html">PhoneStore</a>
         </div>
         <!-- Thanh tìm kiếm (Thanh Nhàn) -->
          <div class="search-bar">
            <input type="text" placeholder="Tìm kiếm sản phẩm...">
          </div>
            <!-- Menu điều hướng chính -->
            <nav class="main-nav">
                <ul>
                    <li><a href="index.html#home">Trang chủ</a></li>
                    <li><a href="index.html#products">Danh mục </a></li>
                    <li><a href="index.html#promotions">Khuyến mãi</a></li>
                    <li><a href="index.html#">Tin Tức</a></li>
                </ul>
            </nav>
          <!-- Hành động người dùng -->
          <div class="user-actions" >
            <!-- Giỏ Hàng (Quốc Cường)-->
            <!-- Trỏ đến user-account.html và dùng hash #cart để sử dụng router -->
            <a href="user-account.html#cart" class="cart-icon">
                <div class="cart-icon-wrapper">
                    <img src="./assets/images/icons/icon-cart.png" alt="icon cart" class="logo">
                    <span class="cart-count">0</span>
                </div>
            </a>
          </div>
          <!-- Tài khoản (Tuấn Khôi) -->
          <div class="user-acount-area">
                <a href="auth.html" class="acount-icon">
                    <img src="./assets/images/icons/logo-account.png" alt="logo account" class="logo">
                    <span>Tài khoản</span>
                </a>
          </div>
        </div>
</header>
<body>
</body>
</html>
